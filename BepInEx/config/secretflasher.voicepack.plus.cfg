[]

## The name of the folder in BepInEx\plugins\SecretFlasher.VoicePack-Plus that contains the voice pack you want to use.
# Setting type: String
# Default value: VoicePack
VoicePack = VoicePackEFVP

[1. Debug]

## Master switch for all debug logs.
## 全局调试总开关 (只有开启此项，下方的具体日志开关才生效)。
# Setting type: Boolean
# Default value: false
GlobalDebug = false

## Log Ecstasy value and calculated speed.
## 记录Ecstasy数值与增速计算结果 (频率较高，建议仅调试时开启)。
# Setting type: Boolean
# Default value: false
LogSpeedCalculation = false

## Log audio stage changes (e.g. Low -> Med).
## 记录音频阶段变更事件 (例如：Low -> Med)。
# Setting type: Boolean
# Default value: false
LogLevelChange = false

## Log actual audio playback time, clip name, and next scheduled time.
## 记录实际播放时间、音频文件名以及下一次预计播放时间。
# Setting type: Boolean
# Default value: false
LogPlayback = false

## Log Climax state locking/unlocking events.
## 记录Climax状态的锁定与解锁事件。
# Setting type: Boolean
# Default value: false
LogClimaxLock = false

## Log audio resource reload events (Self-Healing).
## 记录音频资源重载/自愈事件。
# Setting type: Boolean
# Default value: false
LogReload = false

## Log for audio play states of HeatBeat change.
## 记录心率变化的声音播放情况
# Setting type: Boolean
# Default value: false
LogHeartBeat = false

[2. Playback]

## Base interval for Low stage (Seconds).
## Low 阶段的基础播放间隔 (秒)。
# Setting type: Single
# Default value: 1.1
LowBaseInterval = 1.1

## Base interval for Med stage (Seconds).
## Med 阶段的基础播放间隔 (秒)。
# Setting type: Single
# Default value: 0.8
MedBaseInterval = 0.8

## Base interval for High stage (Seconds).
## High 阶段的基础播放间隔 (秒)。
# Setting type: Single
# Default value: 0.7
HighBaseInterval = 0.7

## Base interval for HighLong stage (Seconds).
## HighLong 阶段的基础播放间隔 (秒)。
# Setting type: Single
# Default value: 1.2
HighLongBaseInterval = 1.2

## Base interval for Climax stage (Seconds).
## Climax 阶段的基础播放间隔 (秒)。
# Setting type: Single
# Default value: 0.8
ClimaxBaseInterval = 0.8

## Global minimum interval between any clips.
## 全局最小播放间隔 (秒)。
# Setting type: Single
# Default value: 0.4
MinPlayInterval = 0.4

## Threshold to force play if skipped due to lag.
## 强制播放的过期时间阈值 (秒)。
# Setting type: Single
# Default value: 0.2
ExpiredPlayThreshold = 0.2

## Max wait time for current clip to finish before switching stage.
## 切换阶段时，等待当前音频播放结束的最大时长 (秒)。
# Setting type: Single
# Default value: 2
MaxWaitAudioEndTime = 2

[3. Thresholds]

## Ecstasy threshold for Low stage (0.0 - 1.0).
## Low 阶段的Ecstasy阈值。
# Setting type: Single
# Default value: 0.02
# Acceptable value range: From 0 to 1
LowThreshold = 0.02

## Ecstasy threshold for Med stage (0.0 - 1.0).
## Med 阶段的Ecstasy阈值。
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 1
MedThreshold = 0.3

## Ecstasy threshold for High stage (0.0 - 1.0).
## High 阶段的Ecstasy阈值。
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 1
HighThreshold = 0.6

## Ecstasy threshold for Climax stage (0.0 - 1.0).
## Climax 阶段的Ecstasy阈值。
# Setting type: Single
# Default value: 0.99
# Acceptable value range: From 0 to 1
ClimaxThreshold = 0.99

## Ecstasy threshold to reset state.
## 重置所有状态的Ecstasy阈值。
# Setting type: Single
# Default value: 0.05
ResetThreshold = 0.05

## Buffer zone for stage switching to prevent flickering.
## 阶段切换的滞后/缓冲值 (防止临界值反复跳变)。
# Setting type: Single
# Default value: 0.02
Hysteresis = 0.02

[4. Algorithm]

## Minimum speed for calculation formula.
## 计算公式中的最小增速。
# Setting type: Single
# Default value: -0.1
MinSpeed = -0.1

## Maximum speed for calculation formula.
## 计算公式中的最大增速。
# Setting type: Single
# Default value: 0.3
MaxSpeed = 0.3

## Max interval multiplier based on speed.
## 基于增速的最大间隔倍率。
# Setting type: Single
# Default value: 1.9
MaxMultiplier = 1.9

## Pause playback when ecstasy is dropping.
## 当Ecstasy全线下降时暂停播放。
# Setting type: Boolean
# Default value: true
PauseOnAllNonPositiveSpeed = true

[5. HeartBeat]

## Minimum heart rate to allow gasping playback (BPM).
## 心率播放下界 (BPM)，高于此值才播放。
# Setting type: Single
# Default value: 95
# Acceptable value range: From 95 to 152
HeartBeatLowerBound = 95

## Heart rate threshold for Low zone (BPM).
## 低心率区间上界 (BPM)。
# Setting type: Single
# Default value: 110
# Acceptable value range: From 95 to 152
HeartBeatLowThreshold = 110

## Heart rate threshold for Med zone (BPM).
## 中等心率区间上界 (BPM)。
# Setting type: Single
# Default value: 130
# Acceptable value range: From 95 to 152
HeartBeatMedThreshold = 130

## Heart rate threshold for High zone (BPM).
## 高心率区间上界 (BPM)。
# Setting type: Single
# Default value: 145
# Acceptable value range: From 95 to 152
HeartBeatHighThreshold = 145

## Base interval when heart rate is Low (Seconds).
## 低心率区间基础播放间隔 (秒)。
# Setting type: Single
# Default value: 10
HeartBeatLowBaseInterval = 10

## Base interval when heart rate is Med (Seconds).
## 中等心率区间基础播放间隔 (秒)。
# Setting type: Single
# Default value: 5
HeartBeatMedBaseInterval = 5

## Base interval when heart rate is High (Seconds).
## 高心率区间基础播放间隔 (秒)。
# Setting type: Single
# Default value: 1
HeartBeatHighBaseInterval = 1

