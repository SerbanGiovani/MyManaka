## Settings file was created by plugin Interaction Action Logger v1.1.1
## Plugin GUID: local.interaction_action_logger

[Coverage]

## Log entering/leaving interact trigger areas. This can be noisy.
# Setting type: Boolean
# Default value: false
LogAreaEnterExit = false

## Log opening/closing interaction menus and ring menu state changes.
# Setting type: Boolean
# Default value: true
LogMenuOpenClose = true

[Logging]

## Also mirror interaction log lines to BepInEx LogOutput.log.
# Setting type: Boolean
# Default value: false
LogToBepInEx = false

## Append current stage and player position to each event when available.
# Setting type: Boolean
# Default value: true
LogPlayerPosition = true

## Include method return values for hooked methods.
# Setting type: Boolean
# Default value: true
LogMethodResults = true

## Maximum text length for one argument/result value.
# Setting type: Int32
# Default value: 220
MaxArgumentLength = 220

[PlayerPosition]

LogMovementSamples = true

SampleIntervalSeconds = 0.25

MinDistanceMeters = 0.05

