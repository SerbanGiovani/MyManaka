## Settings file was created by plugin Drop and Locate Realtime Bridge v1.4.1
## Plugin GUID: local.drop_and_locate_realtime_bridge

[HUD]

## Draw Drop and Locate coordinates from the realtime bridge instead of the CMv2 state cache.
# Setting type: Boolean
# Default value: true
DrawPluginHud = true

## Normalized horizontal HUD position.
# Setting type: Single
# Default value: 0.185
X = 0.185

## Normalized vertical HUD position from the top of the screen.
# Setting type: Single
# Default value: 0.03
Y = 0.03

## Plugin HUD font size.
# Setting type: Int32
# Default value: 20
FontSize = 20

## Seconds between rebuilding plugin HUD text.
# Setting type: Single
# Default value: 0.25
PrintIntervalSeconds = 0.25

[Logging]

LogToBepInEx = false

[PlayerPosition]

## Track latest player position samples in memory while the player moves.
# Setting type: Boolean
# Default value: true
TrackMovementSamples = true

## Minimum seconds between player position samples.
# Setting type: Single
# Default value: 0.25
SampleIntervalSeconds = 0.25

## Minimum movement distance before refreshing the in-memory player position sample.
# Setting type: Single
# Default value: 0.05
MinDistanceMeters = 0.05

LogMovementSamples = true

