## Settings file was created by plugin Reload All Hotkey v1.0.0
## Plugin GUID: local.reload_all_hotkey

[Hotkey]

## Enable the reload hotkey.
# Setting type: Boolean
# Default value: true
EnableHotkey = true

## Unity KeyCode number for the reload key. 291 = F10.
# Setting type: Int32
# Default value: 291
ReloadKeyCode = 291

## Require LeftCtrl or RightCtrl.
# Setting type: Boolean
# Default value: true
RequireCtrl = true

## Require LeftShift or RightShift.
# Setting type: Boolean
# Default value: false
RequireShift = false

[Reload]

## Reload loaded BepInEx plugin config files. This does not unload/reload plugin DLL code.
# Setting type: Boolean
# Default value: true
ReloadBepInExConfigs = true

## Call Custom Missions v2 Engine.Reload() to reload CustomMissions2 code.
# Setting type: Boolean
# Default value: true
ReloadCustomMissions2 = true

