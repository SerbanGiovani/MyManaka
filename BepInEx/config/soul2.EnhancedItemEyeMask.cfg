## Settings file was created by plugin Enhanced Item Eye Mask v0.5.7
## Plugin GUID: soul2.EnhancedItemEyeMask

[调试]

## 作用/Effect：是否在 runtime.log 里记录原版 MCommon 眼罩视野参数，方便判断原版默认值。默认值：true。
## EN: Whether to log original MCommon eye-mask visibility parameters to runtime.log, useful for discovering native defaults. Default: true.
# Setting type: Boolean
# Default value: true
LogOriginalFogParameters = true

## 作用/Effect：是否输出插件调试日志到 BepInEx 日志。true=输出保存/应用黑雾等信息；false=不输出额外日志。默认值：false。
## EN: Whether to write plugin debug messages to the BepInEx log. true logs save/apply fog details; false writes no extra log messages. Default: false.
# Setting type: Boolean
# Default value: false
DebugLog = false

[调试热读取]

## 作用/Effect：是否每15秒重新读取一次配置文件。true=方便你在游戏运行时调参；false=仅启动时读取。默认值：true。
## EN: Whether to reload the config file every 15 seconds. true makes in-game tuning easier; false reads only on startup. Default: true.
# Setting type: Boolean
# Default value: true
EnableConfigHotReload = true

[黑雾视野限制]

## 作用/Effect：总开关。true=道具眼罩生效时启用黑雾视野限制；false=不启用黑雾，只保留原版眼罩。默认值：true。
## EN: Master switch. true enables the enhanced fog visibility limit while the item eye mask is active; false disables enhanced fog and keeps only the original mask. Default: true.
# Setting type: Boolean
# Default value: true
EnableFogLimit = true

## 作用/Effect：黑雾从距离相机多远的位置开始出现。越小越靠近玩家就开始变暗。推荐调试范围：0.2到1。默认值：0.35。
## EN: Distance from the camera where fog starts. Lower values darken closer to the player. Suggested tuning range: 0.2 to 1. Default: 0.35.
# Setting type: Single
# Default value: 0.35
FogStartDistance = 0.35

## 作用/Effect：黑雾在距离相机多远的位置达到完全遮蔽。越小可见范围越短；越大可见范围越远。推荐调试范围：0.6到3。默认值：1.1。
## EN: Distance from the camera where fog becomes fully opaque. Lower values shorten visibility; higher values extend it. Suggested tuning range: 0.6 to 3. Default: 1.1.
# Setting type: Single
# Default value: 1.1
FogEndDistance = 1.1

## 作用/Effect：黑雾颜色亮度。0=纯黑；0.1=保留一点灰度；0.3=明显变浅。推荐调试范围：0到0.2。默认值：0.06。
## EN: Fog brightness. 0=pure black; 0.1 keeps slight gray detail; 0.3 is much lighter. Suggested tuning range: 0 to 0.2. Default: 0.06.
# Setting type: Single
# Default value: 0.06
FogDarkness = 0.06

[轮廓描绘]

## 作用/Effect：道具眼罩生效时，是否给前方近距离 NPC 添加实验性外描边。默认值：true。
## EN: Whether to add experimental outlines to nearby NPCs in front of the player while the item eye mask is active. Default: true.
# Setting type: Boolean
# Default value: true
EnableNpcOutline = true

## 作用/Effect：道具眼罩生效时，是否给前方近距离掉落物添加实验性外描边。默认值：true。
## EN: Whether to add experimental outlines to nearby dropped items in front of the player while the item eye mask is active. Default: true.
# Setting type: Boolean
# Default value: true
EnableItemOutline = true

## 作用/Effect：轮廓描绘最大距离。越大越容易看到远处目标，但性能开销也更高。默认值：8。
## EN: Maximum outline distance. Higher values show farther targets but cost more performance. Default: 8.
# Setting type: Single
# Default value: 8
OutlineMaxDistance = 8

## 作用/Effect：兼容保留项。0.5.5 起轮廓目标每帧刷新，此项暂不再限制刷新频率。默认值：0.1。
## EN: Compatibility setting. Since 0.5.5 outline targets refresh every frame; this value no longer throttles refresh rate. Default: 0.1.
# Setting type: Single
# Default value: 0.1
OutlineRefreshInterval = 0.1

## 作用/Effect：前方判定。0=前半球都显示；0.5=更靠近视线中心才显示；-1=不限制方向。默认值：0.2。
## EN: Forward-facing filter. 0=front hemisphere; 0.5=closer to view center; -1=no direction limit. Default: 0.2.
# Setting type: Single
# Default value: 0.2
OutlineForwardDotMin = 0.2

## 作用/Effect：旧版网格外扩描边参数，0.5.1 起保留但不再默认使用。默认值：0.035。
## EN: Legacy mesh expansion outline parameter. Kept since 0.5.1 for compatibility but no longer used by default. Default: 0.035.
# Setting type: Single
# Default value: 0.035
OutlineScaleOffset = 0.035

## 作用/Effect：X 光轮廓线宽。推荐 0.015 到 0.08。默认值：0.035。
## EN: X-ray outline line width. Suggested range: 0.015 to 0.08. Default: 0.035.
# Setting type: Single
# Default value: 0.035
OutlineLineWidth = 0.035

[轮廓描绘-道具颜色]

## 作用/Effect：掉落物轮廓红色通道。0到1。默认值：0.1。
## EN: Red channel for dropped-item outlines, from 0 to 1. Default: 0.1.
# Setting type: Single
# Default value: 0.1
ItemOutlineRed = 0.1

## 作用/Effect：掉落物轮廓绿色通道。0到1。默认值：0.9。
## EN: Green channel for dropped-item outlines, from 0 to 1. Default: 0.9.
# Setting type: Single
# Default value: 0.9
ItemOutlineGreen = 0.9

## 作用/Effect：掉落物轮廓蓝色通道。0到1。默认值：1。
## EN: Blue channel for dropped-item outlines, from 0 to 1. Default: 1.
# Setting type: Single
# Default value: 1
ItemOutlineBlue = 1

## 作用/Effect：掉落物轮廓透明度。0到1。默认值：0.95。
## EN: Alpha for dropped-item outlines, from 0 to 1. Default: 0.95.
# Setting type: Single
# Default value: 0.95
ItemOutlineAlpha = 0.95

[轮廓描绘-NPC颜色]

## 作用/Effect：NPC 轮廓红色通道。0到1。默认值：1。
## EN: Red channel for NPC outlines, from 0 to 1. Default: 1.
# Setting type: Single
# Default value: 1
NpcOutlineRed = 1

## 作用/Effect：NPC 轮廓绿色通道。0到1。默认值：0.18。
## EN: Green channel for NPC outlines, from 0 to 1. Default: 0.18.
# Setting type: Single
# Default value: 0.18
NpcOutlineGreen = 0.18

## 作用/Effect：NPC 轮廓蓝色通道。0到1。默认值：0.82。
## EN: Blue channel for NPC outlines, from 0 to 1. Default: 0.82.
# Setting type: Single
# Default value: 0.82
NpcOutlineBlue = 0.82

## 作用/Effect：NPC 轮廓透明度。0到1。默认值：0.95。
## EN: Alpha for NPC outlines, from 0 to 1. Default: 0.95.
# Setting type: Single
# Default value: 0.95
NpcOutlineAlpha = 0.95

[原版视野控制器]

## 作用/Effect：是否调用游戏原版 VisibilityFogController.UpdateEyeMask。true=保留原版眼罩遮蔽通道；false=不主动调用。默认值：true。
## EN: Whether to call the game's original VisibilityFogController.UpdateEyeMask. true keeps the original mask visibility path; false does not call it proactively. Default: true.
# Setting type: Boolean
# Default value: true
UseOriginalFogController = true

## 作用/Effect：是否把 FogStartDistance/FogEndDistance/FogDarkness/OriginalFogDensity 写入原版 MCommon 眼罩参数。这个实验项可能造成眼前黑片感。默认值：false。
## EN: Whether to write FogStartDistance/FogEndDistance/FogDarkness/OriginalFogDensity into the original MCommon eye-mask parameters. This experimental option may create a black-card-in-front effect. Default: false.
# Setting type: Boolean
# Default value: false
OverrideOriginalFogParameters = false

## 作用/Effect：OverrideOriginalFogParameters=true 时写入原版眼罩控制器的雾密度。越低越容易看见近处脚下；越高遮蔽越强。推荐 0.2 到 1。默认值：0.45。
## EN: Fog density written to the original eye-mask controller when OverrideOriginalFogParameters=true. Lower values make nearby ground easier to see; higher values strengthen occlusion. Suggested: 0.2 to 1. Default: 0.45.
# Setting type: Single
# Default value: 0.45
OriginalFogDensity = 0.45

[原版眼罩]

## 作用/Effect：是否保留游戏原版眼罩暗角。true=原版暗角叠加黑雾；false=关闭原版暗角，只测试黑雾。默认值：true。
## EN: Whether to keep the game's original eye-mask vignette. true stacks the original vignette with fog; false hides the original vignette for fog-only testing. Default: true.
# Setting type: Boolean
# Default value: true
KeepOriginalVignette = true

## 作用/Effect：原版眼罩暗角透明度，仅 KeepOriginalVignette=true 时有效。0=不显示暗角；0.5=半透明；1=完整原版暗角。默认值：1。
## EN: Alpha of the original eye-mask vignette, only used when KeepOriginalVignette=true. 0=hidden; 0.5=half transparent; 1=full original vignette. Default: 1.
# Setting type: Single
# Default value: 1
VignetteAlpha = 1

[真实视野限制]

## 作用/Effect：是否同时把游戏世界摄像机远裁剪距离限制到 FogEndDistance。true=即使场景材质不吃雾效也会硬裁剪远处画面；false=不做插件远裁剪。默认值：false。
## EN: Whether to also clamp world camera far clip distance to FogEndDistance. true hard-clips distant world rendering even if materials ignore fog; false disables plugin far-clip limiting. Default: false.
# Setting type: Boolean
# Default value: false
EnableDistanceLimit = false

